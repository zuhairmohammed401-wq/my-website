<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP Lathe Works</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            text-align: center;
            color: #333;
        }
        header {
            background-color: #222;
            color: #fff;

            color: #bbb;
        }

            padding: 20px;
        }

        .btn {
            display: block;
            text-decoration: none;
            padding: 20px;
            margin: 15px auto;
            border-radius: 12px;
            font-size: 22px;
            font-weight: bold;
            width: 90%;
            max-width: 400px;
            transition: 0.3s;
        }
        .wa-btn {
            background-color: #25D366;
            color: white;
        }
        .map-btn {
            background-color: #4285F4;
            color: white;
        }
        /* Photo Gallery */
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            padding: 20px;
        }
        .gallery img {
            width: 90%;
            max-width: 350px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        h2 { font-size: 30px; margin-top: 30px; }

<header>

    </a>

    </a>

    <div class="gallery">
        <img src="photo1.jpg" alt="Lathe Work 1">
